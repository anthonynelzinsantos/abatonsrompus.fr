{{ define "main" }}
	{{ range .Site.RegularPages.GroupByDate "2006" }}
		<h2>{{ .Key }}</h2>
		
		{{ range .Pages }}
			<h3 class="list"><a href="{{ .Permalink }}" title="{{ .Title }}">{{ .Title | markdownify }}</a><time datetime="{{ .PublishDate }}">{{ .PublishDate | time.Format ":date_short" }}</time></h3>
		{{ end }}
	{{ end }}
	
	{{ with index .Site.RegularPages 0 }}
		<div class="embed">
			<iframe src="{{ .Params.Embed }}?subscribe=false" frameBorder="0" width="100%" height="100px"></iframe>
		</div>
	{{ end }}
{{ end }}
